<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <pattern id="g-tl" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.7"/>
    </pattern>
    <marker id="a-tl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#F8FAFC"/>
  <rect width="960" height="540" fill="url(#g-tl)"/>
  <rect x="14" y="14" width="932" height="512" rx="10" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="54" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.2">ARCHIVE // DEVELOPER TOOLING · 2024</text>
  <text x="40" y="84" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#021024">TunneLink Desktop SSH Profile Manager &amp; Port Multiplexer</text>

  <!-- Node 1: Tauri TS UI -->
  <g transform="translate(40, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="248" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">01 // TAURI WEBVIEW UI</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">TypeScript Desk UI</text>
    <rect x="16" y="86" width="216" height="96" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="110" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Profile Organizer</text>
    <text x="26" y="132" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">• prod-db  :5432 → 15432</text>
    <text x="26" y="152" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">• jetson   :9090 → 9090</text>
    <text x="26" y="172" font-family="ui-monospace, monospace" font-size="10" fill="#059669">● Active tunnel status</text>
    <rect x="16" y="200" width="216" height="106" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="26" y="224" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1D4ED8">Typed IPC Commands</text>
    <text x="26" y="246" font-family="ui-monospace, monospace" font-size="10" fill="#1E3A8A">invoke("start_tunnel")</text>
    <text x="26" y="266" font-family="ui-monospace, monospace" font-size="10" fill="#1E3A8A">invoke("stop_tunnel")</text>
    <text x="26" y="286" font-family="system-ui, sans-serif" font-size="11.5" fill="#1E3A8A">Lightweight native binary</text>
  </g>

  <path d="M 290 293 L 344 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-tl)"/>

  <!-- Node 2: Rust Core -->
  <g transform="translate(352, 128)">
    <rect width="256" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="256" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="256" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">02 // RUST IPC CORE</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Process Supervisor</text>
    <rect x="16" y="86" width="224" height="106" rx="6" fill="#0F172A"/>
    <text x="28" y="110" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">SSH TUNNEL SPAWNER</text>
    <text x="28" y="132" font-family="ui-monospace, monospace" font-size="10" fill="#E2E8F0">ssh -N -L local:host:port</text>
    <text x="28" y="152" font-family="ui-monospace, monospace" font-size="10" fill="#E2E8F0">ssh -N -R remote:local</text>
    <text x="28" y="174" font-family="ui-monospace, monospace" font-size="10" fill="#34D399">Auto-cleanup child PIDs</text>
    <rect x="16" y="208" width="224" height="98" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="28" y="232" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">~/.ssh/config Sync</text>
    <text x="28" y="256" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Identity key paths</text>
    <text x="28" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Bastion ProxyJump rules</text>
    <text x="28" y="294" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Keepalive health checks</text>
  </g>

  <path d="M 610 293 L 664 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-tl)"/>

  <!-- Node 3: Encrypted Remote Tunnels -->
  <g transform="translate(672, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#ECFDF5"/>
    <rect y="24" width="248" height="10" fill="#ECFDF5"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">03 // REMOTE ENDPOINTS</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Encrypted Tunnels</text>
    <rect x="16" y="86" width="216" height="68" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="26" y="110" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">Local Forward (-L)</text>
    <text x="26" y="132" font-family="system-ui, sans-serif" font-size="12" fill="#065F46">Private DBs &amp; dashboards</text>
    <rect x="16" y="168" width="216" height="68" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="192" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Remote Forward (-R)</text>
    <text x="26" y="214" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Expose local dev webhooks</text>
    <rect x="16" y="250" width="216" height="56" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="274" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Dynamic SOCKS5 (-D)</text>
    <text x="26" y="294" font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">Secure jump-host routing</text>
  </g>

  <text x="40" y="502" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">TAURI · RUST · TYPESCRIPT · OPENSSH PORT FORWARDING</text>
</svg>
