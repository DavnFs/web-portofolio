<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <pattern id="grid-p" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <filter id="card-shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#021024" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Canvas & Drafting Grid -->
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect width="1200" height="675" fill="url(#grid-p)"/>
  <rect x="16" y="16" width="1168" height="643" rx="12" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Header Strip -->
  <text x="48" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#2563EB" letter-spacing="1.4">01 // SYSTEM ARCHITECTURE · UNDERGRADUATE THESIS 2026</text>
  <text x="48" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#021024">YOLOv11 + ASPP Triple Head &amp; Monte Carlo Dropout Pipeline</text>
  <text x="48" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Edge Perception Target: NVIDIA Jetson Orin NX (20W Mode · TensorRT FP16) · 28-Class Indonesian Road Safety Dataset</text>

  <!-- Top-Right Spec Badge -->
  <rect x="944" y="42" width="208" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="962" y="65" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#2563EB">BUDGET &amp; LATENCY</text>
  <text x="962" y="86" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#021024">20W Edge · &lt; 35 ms</text>

  <!-- STAGE 01: SENSOR INTAKE -->
  <g transform="translate(48, 148)" filter="url(#card-shadow)">
    <rect width="204" height="456" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="204" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="204" height="10" fill="#EFF6FF"/>
    <text x="16" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">01 // SENSOR INTAKE</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">RGB Camera Feed</text>
    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">1080p Road Stream</text>

    <!-- Mini Road Frame Schematic -->
    <rect x="16" y="98" width="172" height="114" rx="6" fill="#0F172A"/>
    <!-- Perspective road lines -->
    <polygon points="16,212 78,148 126,148 188,212" fill="#1E293B"/>
    <line x1="102" y1="152" x2="102" y2="206" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 5"/>
    <!-- Detected obstacle boxes preview -->
    <rect x="52" y="140" width="44" height="34" rx="2" fill="none" stroke="#38BDF8" stroke-width="1.6"/>
    <rect x="116" y="150" width="28" height="42" rx="2" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="3 2"/>
    <text x="24" y="114" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">640×640×3 FP16</text>
    <text x="52" y="136" font-family="ui-monospace, monospace" font-size="8.5" fill="#38BDF8">car 0.94</text>
    <text x="114" y="146" font-family="ui-monospace, monospace" font-size="8.5" fill="#FBBF24">ped σ↑</text>

    <!-- Spec Rows -->
    <rect x="16" y="228" width="172" height="58" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="248" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">Pre-Normalization</text>
    <text x="26" y="264" font-family="ui-monospace, monospace" font-size="10" fill="#475569">Letterbox 640×640</text>
    <text x="26" y="278" font-family="ui-monospace, monospace" font-size="10" fill="#475569">RGB [0,1] CUDA Tensor</text>

    <rect x="16" y="298" width="172" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="318" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">28-Class Domain</text>
    <text x="26" y="335" font-family="ui-monospace, monospace" font-size="10" fill="#475569">• Motorbikes &amp; Angkot</text>
    <text x="26" y="350" font-family="ui-monospace, monospace" font-size="10" fill="#475569">• Pedestrians &amp; Cyclists</text>
    <text x="26" y="365" font-family="ui-monospace, monospace" font-size="10" fill="#475569">• Rain / Glare / Night</text>

    <rect x="16" y="384" width="172" height="54" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="26" y="405" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563EB">ZERO-COPY INGEST</text>
    <text x="26" y="423" font-family="ui-monospace, monospace" font-size="10" fill="#1E3A8A">GStreamer → NVMM</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 254 376 L 290 376" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- STAGE 02: YOLOv11 BACKBONE + ASPP + FPN/PANET -->
  <g transform="translate(296, 148)" filter="url(#card-shadow)">
    <rect width="318" height="456" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="318" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="318" height="10" fill="#EFF6FF"/>
    <text x="16" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">02 // BACKBONE &amp; MULTI-SCALE NECK</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">YOLOv11 + ASPP Triple Head</text>
    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">C3k2 · SPPF · C2PSA Spatial Attention</text>

    <!-- Backbone Chain -->
    <rect x="16" y="98" width="286" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="116" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#475569">YOLOv11 FEATURE EXTRACTOR</text>
    <rect x="26" y="126" width="60" height="32" rx="4" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="39" y="146" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">C3k2</text>
    <path d="M 88 142 L 106 142" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <rect x="110" y="126" width="60" height="32" rx="4" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="124" y="146" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">SPPF</text>
    <path d="M 172 142 L 190 142" stroke="#64748B" stroke-width="1.5" marker-end="url(#arr-slate)"/>
    <rect x="194" y="126" width="98" height="32" rx="4" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="215" y="146" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">C2PSA</text>

    <!-- ASPP Parallel Dilation Block -->
    <rect x="16" y="186" width="286" height="122" rx="6" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
    <text x="26" y="206" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1D4ED8">ASPP MODULE (ATROUS CONTEXT)</text>
    <text x="26" y="222" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">Parallel dilated 3×3 convs · zero resolution loss</text>

    <!-- 4 Dilation Chips + GAP -->
    <rect x="26" y="234" width="52" height="36" rx="4" fill="#FFFFFF" stroke="#60A5FA"/>
    <text x="38" y="250" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563EB">r = 1</text>
    <text x="35" y="263" font-family="ui-monospace, monospace" font-size="8.5" fill="#475569">1×1</text>

    <rect x="84" y="234" width="52" height="36" rx="4" fill="#FFFFFF" stroke="#60A5FA"/>
    <text x="96" y="250" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563EB">r = 6</text>
    <text x="93" y="263" font-family="ui-monospace, monospace" font-size="8.5" fill="#475569">local</text>

    <rect x="142" y="234" width="56" height="36" rx="4" fill="#FFFFFF" stroke="#60A5FA"/>
    <text x="150" y="250" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563EB">r = 12</text>
    <text x="152" y="263" font-family="ui-monospace, monospace" font-size="8.5" fill="#475569">mid</text>

    <rect x="204" y="234" width="56" height="36" rx="4" fill="#FFFFFF" stroke="#60A5FA"/>
    <text x="212" y="250" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#2563EB">r = 18</text>
    <text x="213" y="263" font-family="ui-monospace, monospace" font-size="8.5" fill="#475569">wide</text>

    <rect x="266" y="234" width="26" height="36" rx="4" fill="#DBEAFE" stroke="#3B82F6"/>
    <text x="270" y="255" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" fill="#1D4ED8">GAP</text>

    <text x="26" y="295" font-family="ui-monospace, monospace" font-size="9.5" fill="#1E40AF">Concat → 1×1 Bottleneck → Multi-Scale Neck</text>

    <!-- FPN + PANet Triple Heads -->
    <rect x="16" y="324" width="286" height="114" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="344" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">FPN + PANet BIDIRECTIONAL FUSION</text>

    <rect x="26" y="356" width="82" height="68" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="36" y="375" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">P3 / 8</text>
    <text x="36" y="392" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">80×80 grid</text>
    <text x="36" y="408" font-family="system-ui, sans-serif" font-size="10" fill="#021024">Small objs</text>

    <rect x="118" y="356" width="82" height="68" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="128" y="375" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">P4 / 16</text>
    <text x="128" y="392" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">40×40 grid</text>
    <text x="128" y="408" font-family="system-ui, sans-serif" font-size="10" fill="#021024">Medium</text>

    <rect x="210" y="356" width="82" height="68" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="220" y="375" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">P5 / 32</text>
    <text x="220" y="392" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">20×20 grid</text>
    <text x="220" y="408" font-family="system-ui, sans-serif" font-size="10" fill="#021024">Large objs</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 616 376 L 652 376" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- STAGE 03: MONTE CARLO DROPOUT ENGINE -->
  <g transform="translate(658, 148)" filter="url(#card-shadow)">
    <rect width="268" height="456" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="268" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="268" height="10" fill="#EFF6FF"/>
    <text x="16" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">03 // UNCERTAINTY HEAD</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">MC Dropout Sampling</text>
    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Bayesian Epistemic Approximation</text>

    <!-- N=8 Stochastic Forward Passes Visual -->
    <rect x="16" y="98" width="236" height="148" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="118" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">N = 8 STOCHASTIC PASSES (p = 0.2)</text>

    <!-- Stacked pass bars -->
    <rect x="26" y="130" width="216" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="144" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">Pass t=1 · mask M₁ → ŷ₁ (box, cls)</text>

    <rect x="26" y="156" width="216" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="170" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">Pass t=2 · mask M₂ → ŷ₂ (box, cls)</text>

    <rect x="26" y="182" width="216" height="20" rx="3" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="34" y="196" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" fill="#1D4ED8">··· Single Weight Set in VRAM ···</text>

    <rect x="26" y="208" width="216" height="20" rx="3" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="34" y="222" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">Pass t=8 · mask M₈ → ŷ₈ (box, cls)</text>

    <!-- Variance Formula Box -->
    <rect x="16" y="262" width="236" height="88" rx="6" fill="#0F172A"/>
    <text x="28" y="284" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#60A5FA">EPISTEMIC VARIANCE</text>
    <text x="28" y="308" font-family="ui-monospace, monospace" font-size="13" font-weight="700" fill="#FFFFFF">μ = (1/N) Σ ŷₜ</text>
    <text x="28" y="330" font-family="ui-monospace, monospace" font-size="12" fill="#CBD5E1">σ² = (1/N) Σ (ŷₜ − μ)²</text>

    <!-- Distribution Strip -->
    <rect x="16" y="366" width="236" height="72" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="386" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">IoU Clustering Across Passes</text>
    <text x="26" y="404" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Tight box overlap → Low σ² (trust)</text>
    <text x="26" y="422" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Box divergence → High σ² (OOD alert)</text>
  </g>

  <!-- Arrows 3 -> 4 (Split Decision) -->
  <path d="M 928 310 L 964 310" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <path d="M 928 456 L 964 456" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-amber)"/>

  <!-- STAGE 04: EDGE DECISION -->
  <g transform="translate(970, 148)" filter="url(#card-shadow)">
    <rect width="182" height="456" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="182" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="182" height="10" fill="#EFF6FF"/>
    <text x="14" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">04 // EDGE OUTPUT</text>

    <text x="14" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">Safety Gate</text>
    <text x="14" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Planner Dispatch</text>

    <!-- High Confidence Branch -->
    <rect x="14" y="108" width="154" height="114" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
    <circle cx="30" cy="128" r="5" fill="#2563EB"/>
    <text x="42" y="132" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1D4ED8">LOW σ² (CERTAIN)</text>
    <text x="24" y="156" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#021024">Trusted Detection</text>
    <text x="24" y="176" font-family="ui-monospace, monospace" font-size="10" fill="#334155">Box + Class + Score</text>
    <text x="24" y="194" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">→ ROS Planner Bus</text>

    <!-- High Uncertainty Branch -->
    <rect x="14" y="244" width="154" height="114" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4"/>
    <circle cx="30" cy="264" r="5" fill="#D97706"/>
    <text x="42" y="268" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B45309">HIGH σ² (OOD)</text>
    <text x="24" y="292" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#021024">Ambiguous Frame</text>
    <text x="24" y="312" font-family="ui-monospace, monospace" font-size="10" fill="#78350F">Occluded / Unseen</text>
    <text x="24" y="330" font-family="ui-monospace, monospace" font-size="10" fill="#B45309">→ Trigger Caution</text>

    <!-- Footer Target Box -->
    <rect x="14" y="378" width="154" height="60" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="398" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#475569">RUNTIME ENGINE</text>
    <text x="24" y="415" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#021024">TensorRT FP16</text>
    <text x="24" y="430" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563EB">Jetson Orin NX 20W</text>
  </g>

  <!-- Footer Caption Line -->
  <text x="48" y="636" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">FIG 01 // AUTONOMOUS PERCEPTION ARCHITECTURE · SINGLE-MODEL BAYESIAN APPROXIMATION VS DEEP ENSEMBLES</text>
  <text x="1008" y="636" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">SCALE: P3 / P4 / P5</text>
</svg>
