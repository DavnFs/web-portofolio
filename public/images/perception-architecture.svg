<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <rect width="1200" height="675" fill="currentColor" class="text-surface" rx="8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" stroke="currentColor" class="text-line" rx="7.5"/>
  
  <!-- Grid background lines -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" class="text-line" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4A90E2"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.6"/>

  <!-- Title / Meta -->
  <text x="60" y="70" font-family="ui-monospace, monospace" font-size="12" fill="#4A90E2" letter-spacing="0.1em" font-weight="600">SYSTEM ARCHITECTURE // THESIS 2026</text>
  <text x="60" y="105" font-family="system-ui, sans-serif" font-size="24" fill="currentColor" class="text-ink" font-weight="600">YOLOv11 Perception with ASPP Triple Head &amp; MC Dropout</text>
  <text x="60" y="130" font-family="system-ui, sans-serif" font-size="14" fill="currentColor" class="text-ink-muted">Edge Inference Target: NVIDIA Jetson Orin NX (20W) · Custom 28-Class Dataset</text>

  <!-- Flow Boxes -->

  <!-- 1. Input Source -->
  <g transform="translate(60, 200)">
    <rect width="180" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">01 // SENSOR INPUT</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Camera Telemetry</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">RGB Stream 1080p</text>
    <line x1="20" y1="120" x2="160" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>
    
    <text x="20" y="150" font-family="ui-monospace, monospace" font-size="11" fill="currentColor" class="text-ink-muted">Resolution: 640x640</text>
    <text x="20" y="175" font-family="ui-monospace, monospace" font-size="11" fill="currentColor" class="text-ink-muted">Classes: 28 custom</text>
    <text x="20" y="200" font-family="ui-monospace, monospace" font-size="11" fill="currentColor" class="text-ink-muted">Lighting: Variable</text>
    <text x="20" y="225" font-family="ui-monospace, monospace" font-size="11" fill="currentColor" class="text-ink-muted">Weather: Rain/Fog/Dry</text>
    
    <rect x="20" y="260" width="140" height="50" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="30" y="282" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Input Buffer</text>
    <text x="30" y="298" font-family="ui-monospace, monospace" font-size="11" fill="currentColor" class="text-ink" font-weight="600">Pre-normalized</text>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 240 370 L 300 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Backbone & ASPP -->
  <g transform="translate(310, 200)">
    <rect width="250" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">02 // BACKBONE &amp; NECK</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">YOLOv11 + ASPP</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Multi-scale Context Extraction</text>
    <line x1="20" y1="120" x2="230" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <!-- ASPP Submodule -->
    <rect x="15" y="140" width="220" height="85" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">ASPP Module</text>
    <text x="25" y="185" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Rates: [1, 6, 12, 18] dilations</text>
    <text x="25" y="205" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Captures small &amp; large obstacles</text>

    <!-- FPN + PANet -->
    <rect x="15" y="235" width="220" height="75" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="260" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">FPN + PANet Path</text>
    <text x="25" y="280" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Top-down &amp; bottom-up fusion</text>
    <text x="25" y="295" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Triple-head spatial alignment</text>
  </g>

  <!-- Connect 2 -> 3 -->
  <path d="M 560 370 L 620 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Monte Carlo Dropout -->
  <g transform="translate(630, 200)">
    <rect width="250" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">03 // UNCERTAINTY HEAD</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">MC Dropout Engine</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Bayesian Approximation</text>
    <line x1="20" y1="120" x2="230" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="220" height="85" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">N-Forward Passes (N=8)</text>
    <text x="25" y="185" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Active dropout during test time</text>
    <text x="25" y="205" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">p = 0.2 stochastic sampling</text>

    <rect x="15" y="235" width="220" height="75" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="260" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Variance Calculation</text>
    <text x="25" y="280" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Epistemic uncertainty score</text>
    <text x="25" y="295" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Flags out-of-distribution frames</text>
  </g>

  <!-- Connect 3 -> 4 -->
  <path d="M 880 370 L 940 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Output & Decision -->
  <g transform="translate(950, 200)">
    <rect width="190" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">04 // EDGE DECISION</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Filtered Detections</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Bounding Boxes + Confidence</text>
    <line x1="20" y1="120" x2="170" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="160" height="60" rx="3" fill="#4A90E2" fill-opacity="0.1" stroke="#4A90E2"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#4A90E2" font-weight="600">High Confidence</text>
    <text x="25" y="183" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Dispatch to planner</text>

    <rect x="15" y="215" width="160" height="60" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="240" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" class="text-ink" font-weight="600">High Uncertainty</text>
    <text x="25" y="258" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Flag safety warning</text>

    <text x="20" y="315" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Target: &lt; 35ms latency</text>
  </g>
</svg>
