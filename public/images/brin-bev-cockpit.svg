<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <pattern id="grid-bc" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
    <marker id="arr-bc" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-bcg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect width="1200" height="675" fill="url(#grid-bc)"/>
  <rect x="16" y="16" width="1168" height="643" rx="12" fill="none" stroke="#E2E8F0"/>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563EB" letter-spacing="1.4">DEEP DIVE 02B // FREQUENCY ISOLATION &amp; COMMAND SEQUENCE</text>
  <text x="48" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="#021024">Selective Downsampling &amp; Closed-Loop Waypoint Dispatch Sequence</text>

  <!-- TOP: FREQUENCY SPLIT DIAGRAM -->
  <g transform="translate(48, 124)">
    <rect width="1104" height="214" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="1104" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="1104" height="10" fill="#EFF6FF"/>
    <text x="20" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">A // DUAL-PATH BANDWIDTH ISOLATION (SAFETY-CRITICAL VS OPERATOR DISPLAY)</text>

    <!-- Source Sensor -->
    <rect x="24" y="58" width="210" height="132" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="38" y="84" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#021024">ONBOARD SENSORS</text>
    <text x="38" y="108" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">LiDAR : 20 Hz raw</text>
    <text x="38" y="128" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">IMU   : 50 Hz raw</text>
    <text x="38" y="148" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">RTK   : 10 Hz fix</text>
    <text x="38" y="174" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Full fidelity local bus</text>

    <!-- Upper Path: Onboard Autonomy -->
    <path d="M 234 96 L 310 96" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-bcg)"/>
    <rect x="316" y="58" width="356" height="58" rx="8" fill="#ECFDF5" stroke="#34D399"/>
    <text x="334" y="82" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">FAST PATH · UNTOUCHED AUTONOMY STACK</text>
    <text x="334" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#065F46">Full 20Hz PointCloud2 + 50Hz IMU → Local Costmap &amp; TEB Planner</text>
    <path d="M 672 87 L 750 87" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-bcg)"/>
    <rect x="756" y="58" width="324" height="58" rx="8" fill="#0F172A"/>
    <text x="774" y="82" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#34D399">REAL-TIME EV ACTUATION</text>
    <text x="774" y="102" font-family="ui-monospace, monospace" font-size="10.5" fill="#E2E8F0">Zero wireless dependency for safety</text>

    <!-- Lower Path: Filtered Telemetry to Tablet -->
    <path d="M 234 158 L 310 158" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-bc)"/>
    <rect x="316" y="130" width="356" height="60" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="334" y="154" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1D4ED8">FILTERED PATH · VOXEL DOWNSAMPLE (10 Hz)</text>
    <text x="334" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#1E3A8A">message_filters sync + 2D obstacle slice → JSON WebSocket</text>
    <path d="M 672 160 L 750 160" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-bc)"/>
    <rect x="756" y="130" width="324" height="60" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="774" y="154" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#2563EB">FLUTTER COCKPIT (60 FPS)</text>
    <text x="774" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Smooth 5GHz Wi-Fi rendering without link saturation</text>
  </g>

  <!-- BOTTOM: SEQUENCE FLOW FOR WAYPOINT DISPATCH -->
  <g transform="translate(48, 362)">
    <rect width="1104" height="248" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="1104" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="1104" height="10" fill="#EFF6FF"/>
    <text x="20" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">B // INTERACTIVE GOAL-POINT DISPATCH LIFECYCLE (KST FIELD TEST)</text>

    <!-- 4 Sequence Lifelines -->
    <rect x="44" y="54" width="180" height="34" rx="6" fill="#EFF6FF" stroke="#2563EB"/>
    <text x="70" y="75" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1D4ED8">Flutter Tablet</text>
    <line x1="134" y1="88" x2="134" y2="232" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="316" y="54" width="196" height="34" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="342" y="75" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">rosbridge :9090</text>
    <line x1="414" y1="88" x2="414" y2="232" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="604" y="54" width="196" height="34" rx="6" fill="#F8FAFC" stroke="#94A3B8"/>
    <text x="642" y="75" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">move_base</text>
    <line x1="702" y1="88" x2="702" y2="232" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="888" y="54" width="180" height="34" rx="6" fill="#ECFDF5" stroke="#059669"/>
    <text x="912" y="75" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">TEB + EV Drive</text>
    <line x1="978" y1="88" x2="978" y2="232" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4"/>

    <!-- Step 1 -->
    <path d="M 134 118 L 406 118" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-bc)"/>
    <text x="150" y="111" font-family="ui-monospace, monospace" font-size="10" fill="#1D4ED8">1. Operator taps KST map → JSON publish PoseStamped</text>

    <!-- Step 2 -->
    <path d="M 414 152 L 694 152" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-bc)"/>
    <text x="430" y="145" font-family="ui-monospace, monospace" font-size="10" fill="#021024">2. /move_base_simple/goal (frame_id: "map")</text>

    <!-- Step 3 -->
    <path d="M 702 186 L 970 186" stroke="#059669" stroke-width="2" marker-end="url(#arr-bcg)"/>
    <text x="720" y="179" font-family="ui-monospace, monospace" font-size="10" fill="#047857">3. A* path + TEB trajectory → /cmd_vel</text>

    <!-- Step 4 Return -->
    <path d="M 978 216 L 142 216" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-bcg)"/>
    <text x="424" y="210" font-family="ui-monospace, monospace" font-size="10" font-weight="600" fill="#047857">4. Live RTK pose + LiDAR clearance streamed back to cockpit</text>
  </g>

  <text x="48" y="638" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">FIG 02B // BRIN EV TELEMETRY DECOUPLING · SAFE FIELD OPERATION WITHOUT TETHERED RVIZ LAPTOPS</text>
</svg>
