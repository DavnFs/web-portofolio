<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <pattern id="grid-rm" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
    <marker id="arr-rm" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect width="1200" height="675" fill="url(#grid-rm)"/>
  <rect x="16" y="16" width="1168" height="643" rx="12" fill="none" stroke="#E2E8F0"/>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563EB" letter-spacing="1.4">DEEP DIVE 04B // CRYPTOGRAPHIC LIFECYCLE &amp; ROBUST STATISTICS</text>
  <text x="48" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" fill="#021024">Keystore Unseal Sequence &amp; Why Median/MAD Outperforms Naive Mean</text>

  <!-- LEFT: KEYSTORE LIFECYCLE -->
  <g transform="translate(48, 124)">
    <rect width="532" height="486" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="532" height="38" rx="10" fill="#EFF6FF"/>
    <rect y="28" width="532" height="10" fill="#EFF6FF"/>
    <text x="20" y="24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">A // HARDWARE-BACKED KEY LIFECYCLE (ZERO PLAINTEXT KEY)</text>

    <rect x="24" y="60" width="484" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="40" y="84" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">STEP 1 · BIOMETRIC AUTHENTICATION</text>
    <text x="40" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#021024">BiometricPrompt passes Cipher wrapped in CryptoObject to TEE/StrongBox</text>

    <path d="M 266 134 L 266 156" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-rm)"/>

    <rect x="24" y="162" width="484" height="78" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="40" y="186" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1D4ED8">STEP 2 · UNSEAL SQLCIPHER PASSPHRASE IN MEMORY</text>
    <text x="40" y="208" font-family="system-ui, sans-serif" font-size="12" fill="#1E3A8A">Encrypted passphrase blob decrypted via non-exportable AES-256-GCM key</text>
    <text x="40" y="226" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">Passphrase byte[] held strictly in volatile RAM</text>

    <path d="M 266 242 L 266 264" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-rm)"/>

    <rect x="24" y="270" width="484" height="80" rx="8" fill="#0F172A"/>
    <text x="40" y="294" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#60A5FA">STEP 3 · SQLCIPHER PAGE READ / WRITE</text>
    <text x="40" y="316" font-family="ui-monospace, monospace" font-size="10" fill="#FFFFFF">4096-byte pages verified with HMAC-SHA512 before Room DAO query</text>
    <text x="40" y="336" font-family="ui-monospace, monospace" font-size="10" fill="#34D399">Manifest network sockets = 0 (kernel sandbox enforced)</text>

    <path d="M 266 352 L 266 374" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-rm)"/>

    <rect x="24" y="380" width="484" height="82" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="40" y="404" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#B91C1C">STEP 4 · ZEROIZE ON LIFECYCLE PAUSE</text>
    <text x="40" y="426" font-family="system-ui, sans-serif" font-size="12" fill="#7F1D1D">App backgrounding closes SQLCipher handle &amp; overwrites key byte[] with 0x00</text>
    <text x="40" y="446" font-family="ui-monospace, monospace" font-size="10" fill="#991B1B">Protects against cold-boot &amp; forensic memory dumps</text>
  </g>

  <!-- RIGHT: MEAN VS MEDIAN/MAD COMPARISON -->
  <g transform="translate(604, 124)">
    <rect width="548" height="486" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="548" height="38" rx="10" fill="#EFF6FF"/>
    <rect y="28" width="548" height="10" fill="#EFF6FF"/>
    <text x="20" y="24" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">B // EXPLAINABLE NON-PARAMETRIC FORECASTING (&lt; 12ms)</text>

    <text x="20" y="66" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#021024">Cycle Series With Single Missed/Irregular Entry [28, 29, 28, 46, 30, 29, 28]</text>
    <text x="20" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Naive mean is pulled +2.3 days off; Median + MAD stays centered and honest</text>

    <!-- Plot Box -->
    <rect x="24" y="108" width="500" height="224" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <!-- Y axis labels -->
    <text x="36" y="140" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">48d</text>
    <text x="36" y="198" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">36d</text>
    <text x="36" y="256" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">28d</text>
    <text x="36" y="310" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">22d</text>

    <!-- Grid lines -->
    <line x1="68" y1="136" x2="504" y2="136" stroke="#E2E8F0"/>
    <line x1="68" y1="194" x2="504" y2="194" stroke="#E2E8F0"/>
    <line x1="68" y1="252" x2="504" y2="252" stroke="#E2E8F0"/>
    <line x1="68" y1="306" x2="504" y2="306" stroke="#CBD5E1"/>

    <!-- Median +- MAD Shaded Band -->
    <rect x="68" y="232" width="436" height="36" fill="#DBEAFE" fill-opacity="0.7"/>
    <!-- Naive Mean Line (skewed high to ~31.1d) -->
    <line x1="68" y1="224" x2="504" y2="224" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="364" y="217" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#DC2626">Naive Mean: 31.1d</text>

    <!-- Median Line (29.0d) -->
    <line x1="68" y1="250" x2="504" y2="250" stroke="#2563EB" stroke-width="2.2"/>
    <text x="364" y="280" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1D4ED8">Median ± MAD: 29 ± 1.5d</text>

    <!-- Data points -->
    <polyline points="96,256 156,249 216,256 276,144 336,242 396,249 456,256" fill="none" stroke="#64748B" stroke-width="1.6"/>
    <circle cx="96" cy="256" r="5" fill="#2563EB"/>
    <circle cx="156" cy="249" r="5" fill="#2563EB"/>
    <circle cx="216" cy="256" r="5" fill="#2563EB"/>
    <circle cx="276" cy="144" r="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
    <text x="290" y="148" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#DC2626">46d Outlier</text>
    <circle cx="336" cy="242" r="5" fill="#2563EB"/>
    <circle cx="396" cy="249" r="5" fill="#2563EB"/>
    <circle cx="456" cy="256" r="5" fill="#2563EB"/>

    <!-- Bottom Comparison Cards -->
    <rect x="24" y="352" width="242" height="110" rx="8" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="38" y="376" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B91C1C">NAIVE MEAN / BLACK-BOX ML</text>
    <text x="38" y="398" font-family="system-ui, sans-serif" font-size="11.5" fill="#7F1D1D">• Single stress cycle skews forecast</text>
    <text x="38" y="418" font-family="system-ui, sans-serif" font-size="11.5" fill="#7F1D1D">• Heavy model binary &amp; battery drain</text>
    <text x="38" y="438" font-family="system-ui, sans-serif" font-size="11.5" fill="#7F1D1D">• Opaque single-day false precision</text>

    <rect x="282" y="352" width="242" height="110" rx="8" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="296" y="376" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1D4ED8">RUNA MEDIAN / MAD</text>
    <text x="296" y="398" font-family="system-ui, sans-serif" font-size="11.5" fill="#1E3A8A">• 50% breakdown point vs outliers</text>
    <text x="296" y="418" font-family="system-ui, sans-serif" font-size="11.5" fill="#1E3A8A">• &lt; 12ms over 36 months of logs</text>
    <text x="296" y="438" font-family="system-ui, sans-serif" font-size="11.5" fill="#1E3A8A">• Transparent [T_start, T_end] band</text>
  </g>

  <text x="48" y="638" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">FIG 04B // HARDWARE SECURITY &amp; EXPLAINABLE ON-DEVICE STATISTICAL MODELING</text>
</svg>
