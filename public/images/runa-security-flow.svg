<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <rect width="1200" height="675" fill="currentColor" class="text-surface" rx="8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" stroke="currentColor" class="text-line" rx="7.5"/>
  <defs>
    <pattern id="grid-runa" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" class="text-line" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrow-runa" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4A90E2"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#grid-runa)" opacity="0.6"/>

  <text x="60" y="70" font-family="ui-monospace, monospace" font-size="12" fill="#4A90E2" letter-spacing="0.1em" font-weight="600">SECURITY &amp; PRIVACY ARCHITECTURE // RUNA 2024</text>
  <text x="60" y="105" font-family="system-ui, sans-serif" font-size="24" fill="currentColor" class="text-ink" font-weight="600">Zero-Network On-Device Cryptographic Store &amp; Stats</text>
  <text x="60" y="130" font-family="system-ui, sans-serif" font-size="14" fill="currentColor" class="text-ink-muted">No INTERNET Permission in AndroidManifest · Hardware Keystore · SQLCipher · Median/MAD Estimators</text>

  <!-- Box 1: Sandbox Boundary -->
  <g transform="translate(60, 200)">
    <rect width="210" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">01 // OS BOUNDARY</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Android Sandbox</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Zero Cloud Access</text>
    <line x1="20" y1="120" x2="190" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="180" height="50" rx="3" fill="#4A90E2" fill-opacity="0.1" stroke="#4A90E2"/>
    <text x="25" y="162" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">NO INTERNET</text>
    <text x="25" y="178" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Permitted sockets: 0</text>

    <rect x="15" y="200" width="180" height="50" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="222" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Biometric Prompt</text>
    <text x="25" y="238" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">CryptoObject auth guard</text>

    <rect x="15" y="260" width="180" height="50" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="282" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Isolated Process</text>
    <text x="25" y="298" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Strict Unix user-ID barrier</text>
  </g>

  <path d="M 270 370 L 330 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow-runa)"/>

  <!-- Box 2: Key Management -->
  <g transform="translate(340, 200)">
    <rect width="250" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">02 // KEYSTORE</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Hardware Security</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">TEE / StrongBox Enclave</text>
    <line x1="20" y1="120" x2="230" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="220" height="75" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Master Key Generation</text>
    <text x="25" y="185" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">AES-256-GCM / 256-bit entropy</text>
    <text x="25" y="200" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Non-exportable hardware key</text>

    <rect x="15" y="225" width="220" height="85" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="250" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Key Derivation</text>
    <text x="25" y="270" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Decryption key unsealed only after</text>
    <text x="25" y="285" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">successful biometric signature</text>
    <text x="25" y="300" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Wiped from RAM on app pause</text>
  </g>

  <path d="M 590 370 L 650 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow-runa)"/>

  <!-- Box 3: Encrypted Store -->
  <g transform="translate(660, 200)">
    <rect width="250" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">03 // STORAGE</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">SQLCipher DB</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Page-Level Encryption</text>
    <line x1="20" y1="120" x2="230" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="220" height="75" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">4096-byte Page Encryption</text>
    <text x="25" y="185" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">AES-256 with HMAC-SHA512</text>
    <text x="25" y="200" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Zero plaintext disk traces</text>

    <rect x="15" y="225" width="220" height="85" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="250" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Room ORM Integration</text>
    <text x="25" y="270" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Type-safe SQL query layer</text>
    <text x="25" y="285" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Encrypted export / import pass</text>
  </g>

  <path d="M 910 370 L 970 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow-runa)"/>

  <!-- Box 4: Predictor -->
  <g transform="translate(980, 200)">
    <rect width="160" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="15" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">04 // ANALYTICS</text>
    <text x="15" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Robust Stats</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Median / MAD</text>
    <line x1="15" y1="120" x2="145" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="130" height="70" rx="3" fill="#4A90E2" fill-opacity="0.1" stroke="#4A90E2"/>
    <text x="23" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#4A90E2" font-weight="600">Outlier Rejection</text>
    <text x="23" y="183" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Median Absolute Dev</text>
    <text x="23" y="198" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Tolerates missed cycles</text>

    <rect x="15" y="225" width="130" height="70" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="23" y="250" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" class="text-ink" font-weight="600">Range Estimates</text>
    <text x="23" y="268" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Window: [T_start, T_end]</text>
    <text x="23" y="283" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">No false certainty</text>
  </g>
</svg>
