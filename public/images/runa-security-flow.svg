<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <pattern id="grid-r" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
    <marker id="arr-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <filter id="sh-r" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#021024" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect width="1200" height="675" fill="url(#grid-r)"/>
  <rect x="16" y="16" width="1168" height="643" rx="12" fill="none" stroke="#E2E8F0"/>

  <!-- Header -->
  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563EB" letter-spacing="1.4">04 // PRIVACY &amp; CRYPTOGRAPHIC ARCHITECTURE · RUNA 2024</text>
  <text x="48" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#021024">Zero-Network Android Store, Hardware Keystore &amp; Median/MAD Engine</text>
  <text x="48" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">android.permission.INTERNET Excluded · StrongBox/TEE Biometrics · SQLCipher AES-256 · Local Statistics</text>

  <!-- Air-Gap Verification Badge -->
  <rect x="928" y="42" width="224" height="58" rx="8" fill="#ECFDF5" stroke="#34D399" stroke-width="1.2"/>
  <text x="944" y="65" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">MANIFEST AUDIT PASSED</text>
  <text x="944" y="86" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#021024">0 Sockets · &lt; 12ms Local</text>

  <!-- ON-DEVICE AIR-GAPPED SANDBOX CONTAINER -->
  <rect x="44" y="138" width="934" height="466" rx="12" fill="#FFFFFF" fill-opacity="0.55" stroke="#2563EB" stroke-width="1.6" stroke-dasharray="8 5"/>
  <rect x="64" y="126" width="352" height="24" rx="4" fill="#2563EB"/>
  <text x="76" y="142" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#FFFFFF">LOCAL ANDROID OS SANDBOX · STRICTLY AIR-GAPPED</text>

  <!-- 01: BIOMETRIC GATE -->
  <g transform="translate(64, 168)" filter="url(#sh-r)">
    <rect width="204" height="416" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="204" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="204" height="10" fill="#EFF6FF"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#2563EB">01 // AUTH GATE</text>

    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#021024">BiometricPrompt</text>
    <text x="14" y="77" font-family="system-ui, sans-serif" font-size="12" fill="#475569">CryptoObject Binding</text>

    <rect x="14" y="96" width="176" height="86" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="24" y="117" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">KeyGenParameterSpec</text>
    <text x="24" y="136" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563EB">userAuthRequired(true)</text>
    <text x="24" y="153" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">Biometric Strong only</text>
    <text x="24" y="170" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">No fallback plaintext</text>

    <rect x="14" y="198" width="176" height="94" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="24" y="219" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#1D4ED8">TEE / StrongBox HSM</text>
    <text x="24" y="238" font-family="system-ui, sans-serif" font-size="11" fill="#021024">Non-exportable AES-256</text>
    <text x="24" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#021024">GCM master key stays</text>
    <text x="24" y="272" font-family="system-ui, sans-serif" font-size="11" fill="#021024">inside secure hardware</text>

    <rect x="14" y="308" width="176" height="88" rx="6" fill="#FEF2F2" stroke="#FCA5A5"/>
    <text x="24" y="329" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#B91C1C">RAM ZEROIZE HOOK</text>
    <text x="24" y="348" font-family="ui-monospace, monospace" font-size="9.5" fill="#7F1D1D">onPause() / Background</text>
    <text x="24" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D">Wipes unsealed key</text>
    <text x="24" y="381" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D">buffers immediately</text>
  </g>

  <path d="M 270 376 L 302 376" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-r)"/>

  <!-- 02: SQLCIPHER PAGE-ENCRYPTED DATABASE -->
  <g transform="translate(308, 168)" filter="url(#sh-r)">
    <rect width="268" height="416" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="268" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="268" height="10" fill="#EFF6FF"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#2563EB">02 // ENCRYPTED STORAGE</text>

    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#021024">SQLCipher + Room ORM</text>
    <text x="14" y="77" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Zero Plaintext On-Disk Traces</text>

    <!-- 4096-byte Page Layout Visual -->
    <rect x="14" y="96" width="240" height="148" rx="6" fill="#0F172A"/>
    <text x="26" y="117" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#60A5FA">4096-BYTE ENCRYPTED PAGE</text>
    <rect x="26" y="128" width="216" height="32" rx="4" fill="#1E293B" stroke="#3B82F6"/>
    <text x="36" y="148" font-family="ui-monospace, monospace" font-size="10" fill="#FFFFFF">AES-256-CBC Ciphertext Payload</text>
    <rect x="26" y="168" width="104" height="28" rx="4" fill="#1E293B" stroke="#475569"/>
    <text x="36" y="186" font-family="ui-monospace, monospace" font-size="9.5" fill="#93C5FD">16B Random IV</text>
    <rect x="138" y="168" width="104" height="28" rx="4" fill="#1E293B" stroke="#10B981"/>
    <text x="146" y="186" font-family="ui-monospace, monospace" font-size="9.5" fill="#34D399">HMAC-SHA512</text>
    <text x="26" y="220" font-family="ui-monospace, monospace" font-size="9.5" fill="#94A3B8">PBKDF2 256k iter · Per-page MAC</text>

    <rect x="14" y="260" width="240" height="62" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="281" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">Type-Safe Kotlin Room Layer</text>
    <text x="24" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Cycles, symptoms, daily notes DAO</text>

    <rect x="14" y="334" width="240" height="62" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="355" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">Manual Offline Backup</text>
    <text x="24" y="374" font-family="system-ui, sans-serif" font-size="11" fill="#475569">User-encrypted local / USB file only</text>
  </g>

  <path d="M 578 376 L 610 376" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-r)"/>

  <!-- 03: MEDIAN / MAD FORECAST ENGINE -->
  <g transform="translate(616, 168)" filter="url(#sh-r)">
    <rect width="342" height="416" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="342" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="342" height="10" fill="#EFF6FF"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#2563EB">03 // EXPLAINABLE ON-DEVICE STATS</text>

    <text x="14" y="58" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#021024">Median / MAD Estimator</text>
    <text x="14" y="77" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Non-Parametric Outlier-Resistant Prediction</text>

    <!-- Mini Cycle Distribution Chart -->
    <rect x="14" y="96" width="314" height="154" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="114" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#475569">CYCLE LENGTH HISTORY (DAYS) · OUTLIER REJECTION</text>
    <!-- Confidence band -->
    <rect x="34" y="152" width="274" height="42" fill="#DBEAFE" fill-opacity="0.7"/>
    <line x1="34" y1="173" x2="308" y2="173" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="4 3"/>
    <text x="236" y="168" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#1D4ED8">Median = 29d</text>
    <!-- Data points (normal cycles + 1 outlier at 44d rejected) -->
    <polyline points="54,176 92,169 130,174 168,128 206,170 244,179 282,171" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="54" cy="176" r="4.5" fill="#2563EB"/>
    <circle cx="92" cy="169" r="4.5" fill="#2563EB"/>
    <circle cx="130" cy="174" r="4.5" fill="#2563EB"/>
    <!-- Outlier -->
    <circle cx="168" cy="128" r="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
    <text x="178" y="131" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#DC2626">Outlier rejected</text>
    <circle cx="206" cy="170" r="4.5" fill="#2563EB"/>
    <circle cx="244" cy="179" r="4.5" fill="#2563EB"/>
    <circle cx="282" cy="171" r="4.5" fill="#2563EB"/>
    <text x="36" y="236" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">Band: Median ± 1.4826 × MAD → [T_start, T_end]</text>

    <!-- Formula & Jetpack Compose UI -->
    <rect x="14" y="264" width="314" height="64" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="24" y="285" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1D4ED8">MAD = median(|xᵢ − median(x)|)</text>
    <text x="24" y="306" font-family="system-ui, sans-serif" font-size="11.5" fill="#1E3A8A">Computes 36 months of logs in &lt; 12ms on CPU</text>

    <rect x="14" y="340" width="314" height="56" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="24" y="361" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#021024">Jetpack Compose Forecast Card</text>
    <text x="24" y="380" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Honest confidence window — zero false certainty</text>
  </g>

  <!-- BLOCKED CLOUD / NETWORK ZONE (OUTSIDE SANDBOX) -->
  <g transform="translate(998, 168)">
    <rect width="154" height="416" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="16" y="30" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#B91C1C">BLOCKED BY OS</text>
    <text x="16" y="54" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#7F1D1D">External Cloud</text>

    <!-- Red Crossed Shield -->
    <circle cx="77" cy="134" r="38" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.2"/>
    <line x1="51" y1="108" x2="103" y2="160" stroke="#DC2626" stroke-width="3"/>
    <line x1="103" y1="108" x2="51" y2="160" stroke="#DC2626" stroke-width="3"/>

    <text x="16" y="210" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#991B1B">NO INTERNET</text>
    <text x="16" y="228" font-family="ui-monospace, monospace" font-size="9.5" fill="#7F1D1D">PERMISSION</text>

    <line x1="16" y1="248" x2="138" y2="248" stroke="#FCA5A5"/>

    <text x="16" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D">✕ No cloud sync</text>
    <text x="16" y="296" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D">✕ No analytics SDK</text>
    <text x="16" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D">✕ No ad trackers</text>
    <text x="16" y="340" font-family="system-ui, sans-serif" font-size="11" fill="#7F1D1D">✕ No sockets</text>

    <rect x="14" y="362" width="126" height="38" rx="5" fill="#FFFFFF" stroke="#FCA5A5"/>
    <text x="22" y="385" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" fill="#B91C1C">0 BYTES EXFIL</text>
  </g>

  <!-- Footer -->
  <text x="48" y="636" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">FIG 04 // RUNA ZERO-NETWORK ANDROID ARCHITECTURE · PRIVACY GUARANTEED AT OS SANDBOX LAYER</text>
  <text x="980" y="636" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">AES-256 · HMAC-SHA512</text>
</svg>
