<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <pattern id="g-wa" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.7"/>
    </pattern>
    <marker id="a-wa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#F8FAFC"/>
  <rect width="960" height="540" fill="url(#g-wa)"/>
  <rect x="14" y="14" width="932" height="512" rx="10" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="54" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.2">ARCHIVE // EMBEDDED ML · 2024</text>
  <text x="40" y="84" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#021024">Water Quality AIoT Telemetry &amp; XGBoost Suitability Pipeline</text>

  <!-- Node 1: Sensors + ESP32 -->
  <g transform="translate(40, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="248" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">01 // EDGE HARDWARE</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">ESP32 + PlatformIO</text>
    <rect x="16" y="82" width="216" height="64" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="105" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Analog pH Probe</text>
    <text x="26" y="126" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">ADC Calibration · 0–14 pH</text>
    <rect x="16" y="160" width="216" height="64" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="183" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Optical Turbidity (NTU)</text>
    <text x="26" y="204" font-family="ui-monospace, monospace" font-size="10.5" fill="#475569">Suspended solids voltage</text>
    <rect x="16" y="240" width="216" height="68" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="26" y="264" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1D4ED8">JSON Frame Publish</text>
    <text x="26" y="286" font-family="ui-monospace, monospace" font-size="10.5" fill="#1E3A8A">Wi-Fi MQTT QoS 1 Stream</text>
  </g>

  <path d="M 290 293 L 344 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-wa)"/>

  <!-- Node 2: MQTT Broker & Go Ingest -->
  <g transform="translate(352, 128)">
    <rect width="256" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="256" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="256" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">02 // BROKER &amp; INGEST</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">MQTT + Go Worker</text>
    <rect x="16" y="82" width="224" height="106" rx="6" fill="#0F172A"/>
    <text x="28" y="106" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">TOPIC: sensors/water/+</text>
    <text x="28" y="128" font-family="ui-monospace, monospace" font-size="10.5" fill="#E2E8F0">{ "ph": 7.12,</text>
    <text x="28" y="148" font-family="ui-monospace, monospace" font-size="10.5" fill="#E2E8F0">  "ntu": 3.4, "ts": ... }</text>
    <text x="28" y="172" font-family="ui-monospace, monospace" font-size="10" fill="#34D399">Sub-second telemetry bus</text>
    <rect x="16" y="206" width="224" height="102" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="28" y="230" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Window Normalization</text>
    <text x="28" y="254" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Rolling median denoise</text>
    <text x="28" y="274" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Feature vector assembly</text>
    <text x="28" y="294" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Python inference handoff</text>
  </g>

  <path d="M 610 293 L 664 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-wa)"/>

  <!-- Node 3: XGBoost Classifier -->
  <g transform="translate(672, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#ECFDF5"/>
    <rect y="24" width="248" height="10" fill="#ECFDF5"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">03 // CLASSIFICATION</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">XGBoost Inference</text>
    <rect x="16" y="82" width="216" height="92" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="106" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Boosted Decision Trees</text>
    <text x="26" y="128" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Evaluates pH &amp; turbidity</text>
    <text x="26" y="148" font-family="system-ui, sans-serif" font-size="12" fill="#475569">non-linear thresholds</text>
    <rect x="16" y="190" width="216" height="52" rx="6" fill="#ECFDF5" stroke="#34D399"/>
    <text x="28" y="220" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#047857">POTABLE / SAFE</text>
    <rect x="16" y="256" width="216" height="52" rx="6" fill="#FFFBEB" stroke="#F59E0B"/>
    <text x="28" y="286" font-family="ui-monospace, monospace" font-size="11.5" font-weight="700" fill="#B45309">ALERT · UNSAFE</text>
  </g>

  <text x="40" y="502" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">ESP32 · PLATFORMIO · MQTT · GO · PYTHON · XGBOOST</text>
</svg>
