    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">03 // GUIDANCE OUTPUT</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Actionable Summary</text>
    <rect x="16" y="88" width="216" height="100" rx="6" fill="#0F172A"/>
    <text x="26" y="112" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">GEMINI NUTRITION NOTE</text>
    <text x="26" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">Age-appropriate meal plan</text>
    <text x="26" y="154" font-family="system-ui, sans-serif" font-size="12" fill="#E2E8F0">constrained by WHO tier</text>
    <text x="26" y="174" font-family="ui-monospace, monospace" font-size="9.5" fill="#34D399">Non-diagnostic disclaimer</text>
    <rect x="16" y="204" width="216" height="102" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="26" y="228" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">Clinical Safety First</text>
    <text x="26" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#065F46">Deterministic WHO guard</text>
    <text x="26" y="270" font-family="system-ui, sans-serif" font-size="12" fill="#065F46">flags severe cases for</text>
    <text x="26" y="290" font-family="system-ui, sans-serif" font-size="12" fill="#065F46">immediate Puskesmas visit</text>
  </g>

  <text x="40" y="502" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">FASTAPI · REACT · TYPESCRIPT · SCIKIT-LEARN · WHO Z-SCORE · GEMINI</text>
</svg>
