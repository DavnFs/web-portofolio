<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <pattern id="g-sg" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.7"/>
    </pattern>
    <marker id="a-sg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#F8FAFC"/>
  <rect width="960" height="540" fill="url(#g-sg)"/>
  <rect x="14" y="14" width="932" height="512" rx="10" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="54" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.2">ARCHIVE // HEALTH SCREENING · 2024</text>
  <text x="40" y="84" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#021024">StuntGuard Toddler Growth Screening &amp; WHO Safety Fallback</text>

  <!-- Node 1: React TS Intake -->
  <g transform="translate(40, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="248" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">01 // REACT + TS CLIENT</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Anthropometry Intake</text>
    <rect x="16" y="88" width="216" height="114" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="112" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#021024">VALIDATED METRICS</text>
    <text x="26" y="134" font-family="ui-monospace, monospace" font-size="10.5" fill="#2563EB">• Age (0–60 months)</text>
    <text x="26" y="154" font-family="ui-monospace, monospace" font-size="10.5" fill="#2563EB">• Height / Length (cm)</text>
    <text x="26" y="174" font-family="ui-monospace, monospace" font-size="10.5" fill="#2563EB">• Weight (kg) &amp; Sex</text>
    <text x="26" y="194" font-family="ui-monospace, monospace" font-size="10" fill="#64748B">Pydantic schema check</text>
    <rect x="16" y="218" width="216" height="88" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="26" y="242" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1D4ED8">Posyandu Friendly UI</text>
    <text x="26" y="264" font-family="system-ui, sans-serif" font-size="12" fill="#1E3A8A">Instant Z-score chart &amp;</text>
    <text x="26" y="284" font-family="system-ui, sans-serif" font-size="12" fill="#1E3A8A">plain-language guidance</text>
  </g>

  <path d="M 290 293 L 344 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-sg)"/>

  <!-- Node 2: FastAPI Dual Engine -->
  <g transform="translate(352, 128)">
    <rect width="256" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="256" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="256" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">02 // FASTAPI + HYBRID ML</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Classifier + Safety</text>
    <rect x="16" y="88" width="224" height="92" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="112" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">scikit-learn Classifier</text>
    <text x="26" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Predicts stunting risk tier</text>
    <text x="26" y="154" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">Normal · Stunted · Severe</text>
    <rect x="16" y="196" width="224" height="110" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="26" y="220" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#B45309">WHO RULE FALLBACK</text>
    <text x="26" y="242" font-family="ui-monospace, monospace" font-size="10" fill="#78350F">HAZ = (H − M_who) / SD</text>
    <text x="26" y="262" font-family="system-ui, sans-serif" font-size="12" fill="#78350F">Overrides ML on boundary</text>
    <text x="26" y="282" font-family="system-ui, sans-serif" font-size="12" fill="#78350F">cases (HAZ &lt; −2.0 SD)</text>
  </g>

  <path d="M 610 293 L 664 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-sg)"/>

  <!-- Node 3: Gemini Parent Guidance -->
  <g transform="translate(672, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#ECFDF5"/>
