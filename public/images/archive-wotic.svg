<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" fill="none">
  <defs>
    <pattern id="g-wo" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#E2E8F0" stroke-width="0.7"/>
    </pattern>
    <marker id="a-wo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="960" height="540" fill="#F8FAFC"/>
  <rect width="960" height="540" fill="url(#g-wo)"/>
  <rect x="14" y="14" width="932" height="512" rx="10" fill="none" stroke="#E2E8F0"/>

  <text x="40" y="54" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#2563EB" letter-spacing="1.2">ARCHIVE // TOURISM PLATFORM · 2023</text>
  <text x="40" y="84" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#021024">Wotic.id Wonosobo Tourism &amp; Accommodation REST Platform</text>

  <!-- Node 1: Traveler Portal -->
  <g transform="translate(40, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="248" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">01 // WEB &amp; PORTAL</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Regional Directory</text>
    <rect x="16" y="88" width="216" height="96" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="112" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Wonosobo Regency</text>
    <text x="26" y="134" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Dieng homestay search</text>
    <text x="26" y="154" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Attraction &amp; route info</text>
    <text x="26" y="174" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Price &amp; facility filters</text>
    <rect x="16" y="202" width="216" height="104" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="26" y="226" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#1D4ED8">Client Consumers</text>
    <text x="26" y="248" font-family="ui-monospace, monospace" font-size="10.5" fill="#1E3A8A">GET /api/listings</text>
    <text x="26" y="268" font-family="ui-monospace, monospace" font-size="10.5" fill="#1E3A8A">GET /api/districts</text>
    <text x="26" y="288" font-family="system-ui, sans-serif" font-size="11.5" fill="#1E3A8A">Paginated JSON responses</text>
  </g>

  <path d="M 290 293 L 344 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-wo)"/>

  <!-- Node 2: Laravel REST API -->
  <g transform="translate(352, 128)">
    <rect width="256" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="256" height="34" rx="10" fill="#EFF6FF"/>
    <rect y="24" width="256" height="10" fill="#EFF6FF"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">02 // LARAVEL REST API</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Controller &amp; Auth</text>
    <rect x="16" y="88" width="224" height="104" rx="6" fill="#0F172A"/>
    <text x="28" y="112" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#38BDF8">REST RESOURCE LAYER</text>
    <text x="28" y="134" font-family="ui-monospace, monospace" font-size="10" fill="#E2E8F0">• Sanctum Token Auth</text>
    <text x="28" y="154" font-family="ui-monospace, monospace" font-size="10" fill="#E2E8F0">• Eloquent Query Scopes</text>
    <text x="28" y="174" font-family="ui-monospace, monospace" font-size="10" fill="#34D399">• Validated JSON Resources</text>
    <rect x="16" y="208" width="224" height="98" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="28" y="232" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">Host Management</text>
    <text x="28" y="256" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Accommodation CRUD</text>
    <text x="28" y="276" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Media gallery uploads</text>
    <text x="28" y="294" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Admin moderation</text>
  </g>

  <path d="M 610 293 L 664 293" stroke="#2563EB" stroke-width="2.4" marker-end="url(#a-wo)"/>

  <!-- Node 3: MySQL Relational Schema -->
  <g transform="translate(672, 128)">
    <rect width="248" height="330" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="248" height="34" rx="10" fill="#ECFDF5"/>
    <rect y="24" width="248" height="10" fill="#ECFDF5"/>
    <text x="16" y="22" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">03 // MYSQL SCHEMA</text>
    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#021024">Normalized Tables</text>
    <rect x="16" y="88" width="216" height="64" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="112" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">accommodations</text>
    <text x="26" y="132" font-family="ui-monospace, monospace" font-size="10" fill="#475569">id · district_id · rate · geo</text>
    <rect x="16" y="164" width="216" height="64" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="188" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#021024">amenities &amp; pivot</text>
    <text x="26" y="208" font-family="ui-monospace, monospace" font-size="10" fill="#475569">Many-to-many facility index</text>
    <rect x="16" y="240" width="216" height="66" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="26" y="264" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">reviews &amp; ratings</text>
    <text x="26" y="284" font-family="ui-monospace, monospace" font-size="10" fill="#065F46">Indexed regional search</text>
  </g>

  <text x="40" y="502" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">LARAVEL · JAVASCRIPT · MYSQL · RESTFUL TOURISM API</text>
</svg>
