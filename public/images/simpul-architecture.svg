<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" fill="none">
  <rect width="1200" height="675" fill="currentColor" class="text-surface" rx="8"/>
  <rect x="0.5" y="0.5" width="1199" height="674" stroke="currentColor" class="text-line" rx="7.5"/>
  <defs>
    <pattern id="grid-simpul" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" class="text-line" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <marker id="arrow-simpul" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#4A90E2"/>
    </marker>
  </defs>
  <rect width="1200" height="675" fill="url(#grid-simpul)" opacity="0.6"/>

  <text x="60" y="70" font-family="ui-monospace, monospace" font-size="12" fill="#4A90E2" letter-spacing="0.1em" font-weight="600">PLATFORM ARCHITECTURE // SIMPUL 2025</text>
  <text x="60" y="105" font-family="system-ui, sans-serif" font-size="24" fill="currentColor" class="text-ink" font-weight="600">Multi-Sided Marketplace with Contextual LLM Assistant</text>
  <text x="60" y="130" font-family="system-ui, sans-serif" font-size="14" fill="currentColor" class="text-ink-muted">Express.js API Gateway, Supabase PostgreSQL, Midtrans Escrow, and Token-Optimized NLP</text>

  <!-- Box 1: Clients -->
  <g transform="translate(60, 200)">
    <rect width="210" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">01 // CLIENT APPS</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Flutter Applications</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Multi-role Interfaces</text>
    <line x1="20" y1="120" x2="190" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="180" height="50" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="162" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Consumer App</text>
    <text x="25" y="178" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Browse, book &amp; chat</text>

    <rect x="15" y="200" width="180" height="50" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="222" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Vendor Portal (KYB)</text>
    <text x="25" y="238" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Verification &amp; catalog</text>

    <rect x="15" y="260" width="180" height="50" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="282" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Admin Console</text>
    <text x="25" y="298" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Dispute &amp; settlement</text>
  </g>

  <path d="M 270 370 L 330 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow-simpul)"/>

  <!-- Box 2: API Gateway & Services -->
  <g transform="translate(340, 200)">
    <rect width="250" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">02 // BACKEND CORE</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Express.js + Prisma</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">REST API &amp; Auth Guard</text>
    <line x1="20" y1="120" x2="230" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="220" height="75" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Role-Based Access Control</text>
    <text x="25" y="185" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">JWT verification &amp; vendor state</text>
    <text x="25" y="200" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Order lifecycle state machine</text>

    <rect x="15" y="225" width="220" height="85" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="250" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Escrow &amp; Midtrans Webhook</text>
    <text x="25" y="270" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Idempotent payment handler</text>
    <text x="25" y="285" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Automated payment capture</text>
  </g>

  <path d="M 590 370 L 650 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow-simpul)"/>

  <!-- Box 3: LLM Optimization Layer -->
  <g transform="translate(660, 200)">
    <rect width="250" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="20" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">03 // AI ASSISTANT</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Token-Optimized NLP</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Context Compression</text>
    <line x1="20" y1="120" x2="230" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="220" height="75" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="165" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Intent &amp; Entity Extraction</text>
    <text x="25" y="185" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Budget, dates, guest counts</text>
    <text x="25" y="200" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Prunes conversational filler</text>

    <rect x="15" y="225" width="220" height="85" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="25" y="250" font-family="system-ui, sans-serif" font-size="12" fill="currentColor" class="text-ink" font-weight="600">Cached Prompt Embeddings</text>
    <text x="25" y="270" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Reduces round-trip token cost</text>
    <text x="25" y="285" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Structured JSON output schema</text>
  </g>

  <path d="M 910 370 L 970 370" stroke="#4A90E2" stroke-width="2" marker-end="url(#arrow-simpul)"/>

  <!-- Box 4: Persistence -->
  <g transform="translate(980, 200)">
    <rect width="160" height="340" rx="4" fill="currentColor" class="text-bg" stroke="currentColor" class="text-line" stroke-width="1.5"/>
    <text x="15" y="35" font-family="ui-monospace, monospace" font-size="11" fill="#4A90E2" font-weight="600">04 // PERSISTENCE</text>
    <text x="15" y="70" font-family="system-ui, sans-serif" font-size="16" fill="currentColor" class="text-ink" font-weight="600">Database</text>
    <text x="15" y="95" font-family="system-ui, sans-serif" font-size="13" fill="currentColor" class="text-ink-muted">Supabase Postgres</text>
    <line x1="15" y1="120" x2="145" y2="120" stroke="currentColor" class="text-line" stroke-width="1"/>

    <rect x="15" y="140" width="130" height="70" rx="3" fill="currentColor" class="text-surface" stroke="currentColor" class="text-line"/>
    <text x="23" y="165" font-family="system-ui, sans-serif" font-size="11" fill="currentColor" class="text-ink" font-weight="600">Relational Schema</text>
    <text x="23" y="183" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Prisma Migrations</text>
    <text x="23" y="198" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Strict foreign keys</text>

    <rect x="15" y="225" width="130" height="70" rx="3" fill="#4A90E2" fill-opacity="0.1" stroke="#4A90E2"/>
    <text x="23" y="250" font-family="system-ui, sans-serif" font-size="11" fill="#4A90E2" font-weight="600">Audit Logs</text>
    <text x="23" y="268" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Booking transitions</text>
    <text x="23" y="283" font-family="ui-monospace, monospace" font-size="10" fill="currentColor" class="text-ink-muted">Dispute records</text>
  </g>
</svg>
