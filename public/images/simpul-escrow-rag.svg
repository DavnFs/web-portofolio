    <text x="40" y="428" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Strict PostgreSQL foreign keys prevent double-booked vendor dates</text>
    <text x="40" y="448" font-family="system-ui, sans-serif" font-size="12" fill="#475569">• Immutable audit records retained for dispute resolution</text>
