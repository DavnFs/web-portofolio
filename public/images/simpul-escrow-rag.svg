    <text x="40" y="198" font-family="ui-monospace, monospace" font-size="10" fill="#E2E8F0">SET lock:webhook:{order_id} "1" NX EX 10  →  Reject concurrent duplicates</text>
    <text x="40" y="216" font-family="ui-monospace, monospace" font-size="10" fill="#34D399">Verify SHA512(order_id + status_code + gross_amount + ServerKey)</text>

    <path d="M 269 228 L 269 252" stroke="#059669" stroke-width="2" marker-end="url(#arr-srg)"/>

