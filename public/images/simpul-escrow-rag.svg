    <text x="168" y="316" font-family="ui-monospace, monospace" font-size="12" fill="#059669">→</text>
    <rect x="188" y="298" width="144" height="28" rx="5" fill="#FFFFFF" stroke="#6EE7B7"/>
    <text x="202" y="316" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#065F46">PROGRESS CHECK</text>
