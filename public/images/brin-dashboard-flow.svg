<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <pattern id="grid-b" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E2E8F0" stroke-width="0.75"/>
    </pattern>
    <marker id="arr-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <filter id="sh-b" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#021024" flood-opacity="0.05"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#F8FAFC"/>
  <rect width="1200" height="675" fill="url(#grid-b)"/>
  <rect x="16" y="16" width="1168" height="643" rx="12" fill="none" stroke="#E2E8F0"/>

  <!-- Header -->
  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#2563EB" letter-spacing="1.4">02 // ROBOTICS TELEMETRY · BRIN SMART MECHATRONICS 2025</text>
  <text x="48" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#021024">Autonomous EV ROS1 Telemetry &amp; Flutter Operator Cockpit</text>
  <text x="48" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569">Bi-Directional Sensor Aggregation (LiDAR · RTK-GPS · 6-DOF IMU) &amp; Interactive Waypoint Dispatch</text>

  <!-- Top-Right Badge -->
  <rect x="938" y="42" width="214" height="58" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="954" y="65" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#059669">CLOSED-LOOP CONTROL</text>
  <text x="954" y="86" font-family="ui-monospace, monospace" font-size="12.5" font-weight="700" fill="#021024">ROS1 Noetic ↔ WS :9090</text>

  <!-- 01: VEHICLE SENSORS -->
  <g transform="translate(48, 148)" filter="url(#sh-b)">
    <rect width="232" height="414" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="232" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="232" height="10" fill="#EFF6FF"/>
    <text x="16" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">01 // EV SENSOR BUS</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">Physical Perception</text>
    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Multi-rate ROS1 Publishers</text>

    <rect x="16" y="102" width="200" height="84" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="124" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#021024">3D LiDAR Scanner</text>
    <text x="26" y="143" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">/velodyne_points</text>
    <text x="26" y="160" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">sensor_msgs/PointCloud2</text>
    <text x="26" y="176" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">Full bus 20Hz → UI 10Hz</text>

    <rect x="16" y="200" width="200" height="84" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#021024">RTK-GPS / GNSS</text>
    <text x="26" y="241" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">/fix</text>
    <text x="26" y="258" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">sensor_msgs/NavSatFix</text>
    <text x="26" y="274" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">Centimeter KST coordinates</text>

    <rect x="16" y="298" width="200" height="94" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="26" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#021024">6-DOF IMU &amp; Odometry</text>
    <text x="26" y="339" font-family="ui-monospace, monospace" font-size="10" fill="#2563EB">/imu/data · /odom</text>
    <text x="26" y="356" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">sensor_msgs/Imu (50Hz)</text>
    <text x="26" y="373" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">Yaw, roll, linear velocity</text>
  </g>

  <path d="M 282 350 L 318 350" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-b)"/>

  <!-- 02: ROS1 MIDDLEWARE & ROSBRIDGE -->
  <g transform="translate(324, 148)" filter="url(#sh-b)">
    <rect width="256" height="414" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="256" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="256" height="10" fill="#EFF6FF"/>
    <text x="16" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">02 // ROS1 MIDDLEWARE</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">Sync &amp; Rosbridge</text>
    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">Onboard Serialization Node</text>

    <rect x="16" y="102" width="224" height="102" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="124" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#021024">message_filters</text>
    <text x="26" y="142" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563EB">ApproximateTimeSynchronizer</text>
    <text x="26" y="162" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Aligns LiDAR, GPS &amp; IMU</text>
    <text x="26" y="178" font-family="system-ui, sans-serif" font-size="11" fill="#475569">timestamps to prevent drift</text>
    <text x="26" y="194" font-family="ui-monospace, monospace" font-size="9.5" fill="#64748B">Spatial voxel filter → 10Hz UI</text>

    <rect x="16" y="220" width="224" height="114" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
    <text x="26" y="242" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#1D4ED8">rosbridge_server :9090</text>
    <text x="26" y="262" font-family="system-ui, sans-serif" font-size="11.5" fill="#021024">JSON WebSocket Daemon</text>
    <text x="26" y="282" font-family="ui-monospace, monospace" font-size="9.5" fill="#334155">• Pub/Sub topic framing</text>
    <text x="26" y="298" font-family="ui-monospace, monospace" font-size="9.5" fill="#334155">• 5GHz local field Wi-Fi</text>
    <text x="26" y="314" font-family="ui-monospace, monospace" font-size="9.5" fill="#334155">• Onboard stack untouched</text>

    <rect x="16" y="348" width="224" height="44" rx="6" fill="#ECFDF5" stroke="#6EE7B7"/>
    <text x="26" y="375" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#047857">← Inbound Goal Topic Injection</text>
  </g>

  <path d="M 582 350 L 618 350" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-b)"/>

  <!-- 03: FLUTTER OPERATOR COCKPIT (WITH MINI UI SCHEMATIC) -->
  <g transform="translate(624, 148)" filter="url(#sh-b)">
    <rect width="302" height="414" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="302" height="36" rx="10" fill="#EFF6FF"/>
    <rect y="26" width="302" height="10" fill="#EFF6FF"/>
    <text x="16" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#2563EB">03 // FLUTTER OPERATOR COCKPIT</text>

    <text x="16" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">60 FPS Field Tablet UI</text>
    <text x="16" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">KST Test Map · LiDAR Overlay · Waypoint Tap</text>

    <!-- Tablet Map & LiDAR Schematic -->
    <rect x="16" y="98" width="270" height="186" rx="8" fill="#0F172A" stroke="#1E293B"/>
    <!-- Concentric LiDAR rings -->
    <circle cx="116" cy="196" r="24" fill="none" stroke="#1E3A8A" stroke-width="1"/>
    <circle cx="116" cy="196" r="48" fill="none" stroke="#1E3A8A" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="116" cy="196" r="72" fill="none" stroke="#1E293B" stroke-width="1"/>
    <!-- Planned trajectory path -->
    <path d="M 116 196 Q 152 162 214 146" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-dasharray="5 3"/>
    <!-- EV Pose triangle -->
    <polygon points="116,186 123,202 109,202" fill="#60A5FA"/>
    <!-- Waypoint pin -->
    <circle cx="214" cy="146" r="7" fill="#10B981" fill-opacity="0.25" stroke="#10B981" stroke-width="1.8"/>
    <circle cx="214" cy="146" r="2.5" fill="#10B981"/>
    <!-- Simulated obstacle clusters -->
    <circle cx="88" cy="166" r="3" fill="#F59E0B"/>
    <circle cx="94" cy="161" r="2.5" fill="#F59E0B"/>
    <circle cx="152" cy="218" r="3" fill="#F59E0B"/>

    <!-- Mini Telemetry HUD strip inside tablet -->
    <text x="26" y="116" font-family="ui-monospace, monospace" font-size="9" fill="#94A3B8">BRIN KST MAP · RTK FIXED</text>
    <text x="192" y="132" font-family="ui-monospace, monospace" font-size="9" fill="#34D399">GOAL (x,y,θ)</text>
    <rect x="24" y="250" width="76" height="24" rx="4" fill="#1E293B"/>
    <text x="32" y="266" font-family="ui-monospace, monospace" font-size="9.5" fill="#E2E8F0">18.4 km/h</text>
    <rect x="108" y="250" width="76" height="24" rx="4" fill="#1E293B"/>
    <text x="118" y="266" font-family="ui-monospace, monospace" font-size="9.5" fill="#34D399">BAT 84%</text>
    <rect x="192" y="250" width="84" height="24" rx="4" fill="#1E293B"/>
    <text x="200" y="266" font-family="ui-monospace, monospace" font-size="9.5" fill="#38BDF8">YAW 142°</text>

    <!-- Operator Controls List -->
    <rect x="16" y="298" width="270" height="94" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="26" y="319" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700" fill="#021024">REACTIVE VECTOR CANVAS</text>
    <text x="26" y="339" font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">• Custom Flutter Canvas (no heavy web RViz)</text>
    <text x="26" y="358" font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">• Tap map to publish PoseStamped waypoint</text>
    <text x="26" y="377" font-family="system-ui, sans-serif" font-size="11.5" fill="#475569">• Live obstacle boundary &amp; E-stop state</text>
  </g>

  <path d="M 928 350 L 964 350" stroke="#059669" stroke-width="2.2" marker-end="url(#arr-g)"/>

  <!-- 04: AUTONOMOUS PLANNER STACK -->
  <g transform="translate(970, 148)" filter="url(#sh-b)">
    <rect width="182" height="414" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.25"/>
    <rect width="182" height="36" rx="10" fill="#ECFDF5"/>
    <rect y="26" width="182" height="10" fill="#ECFDF5"/>
    <text x="14" y="23" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#047857">04 // NAVIGATION</text>

    <text x="14" y="62" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#021024">Goal Dispatch</text>
    <text x="14" y="82" font-family="system-ui, sans-serif" font-size="12" fill="#475569">ROS move_base Stack</text>

    <rect x="14" y="102" width="154" height="90" rx="6" fill="#ECFDF5" stroke="#34D399"/>
    <text x="24" y="124" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#047857">/move_base_simple</text>
    <text x="24" y="140" font-family="ui-monospace, monospace" font-size="9.5" fill="#065F46">/goal</text>
    <text x="24" y="160" font-family="ui-monospace, monospace" font-size="9.5" fill="#334155">PoseStamped (map)</text>
    <text x="24" y="176" font-family="ui-monospace, monospace" font-size="9.5" fill="#334155">Position + Quaternion</text>

    <rect x="14" y="206" width="154" height="90" rx="6" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text x="24" y="228" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#021024">Global + Local Plan</text>
    <text x="24" y="248" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563EB">A* Global Planner</text>
    <text x="24" y="265" font-family="ui-monospace, monospace" font-size="9.5" fill="#2563EB">TEB Local Planner</text>
    <text x="24" y="282" font-family="ui-monospace, monospace" font-size="9.5" fill="#475569">Ackermann kinematics</text>

    <rect x="14" y="310" width="154" height="82" rx="6" fill="#0F172A"/>
    <text x="24" y="332" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38BDF8">ACTUATION OUT</text>
    <text x="24" y="352" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#FFFFFF">/cmd_vel</text>
    <text x="24" y="370" font-family="ui-monospace, monospace" font-size="9.5" fill="#94A3B8">geometry_msgs/Twist</text>
  </g>

  <!-- Return Closed-Loop Bar at Bottom -->
  <path d="M 1061 564 L 1061 598 L 452 598 L 452 568" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-g)"/>
  <rect x="616" y="582" width="320" height="28" rx="14" fill="#ECFDF5" stroke="#6EE7B7"/>
  <text x="636" y="600" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600" fill="#047857">CLOSED-LOOP WAYPOINT &amp; ACTUATION FEEDBACK</text>

  <!-- Footer -->
  <text x="48" y="638" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">FIG 02 // BRIN AUTONOMOUS ELECTRIC VEHICLE PLATFORM · KAWASAN SAINS DAN TEKNOLOGI (KST)</text>
  <text x="984" y="638" font-family="ui-monospace, monospace" font-size="11" fill="#64748B">3 FUSED SENSOR STREAMS</text>
</svg>
